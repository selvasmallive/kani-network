apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator-a
  labels:
    app.kubernetes.io/name: kani-validator
    app.kubernetes.io/instance: validator-a
    app.kubernetes.io/part-of: kani-network
    kani.phase: "phase-5b"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kani-validator
      app.kubernetes.io/instance: validator-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kani-validator
        app.kubernetes.io/instance: validator-a
        app.kubernetes.io/part-of: kani-network
        kani.phase: "phase-5b"
    spec:
      automountServiceAccountToken: true
      serviceAccountName: kani-validator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kani-node
          image: kani-validator-image
          command: ["kani-node"]
          envFrom:
            - configMapRef:
                name: kani-validator-config
            - secretRef:
                name: kani-ledger-database
          env:
            - name: KANI_VALIDATOR_ID
              value: validator-a
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2
          args:
            - --structured-logs
            - --port=5432
            - $(CLOUD_SQL_CONNECTION_NAME)
          env:
            - name: CLOUD_SQL_CONNECTION_NAME
              valueFrom:
                configMapKeyRef:
                  name: kani-validator-config
                  key: CLOUD_SQL_CONNECTION_NAME
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
