services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: kani
      POSTGRES_USER: kani
      POSTGRES_PASSWORD: kani
    ports:
      - "5432:5432"
    volumes:
      - kani-postgres:/var/lib/postgresql/data

  kani-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    environment:
      KANI_API_ADDR: 0.0.0.0:8080
      KANI_LEDGER_MODE: postgres
      DATABASE_URL: postgres://kani:kani@postgres:5432/kani
      ENV: SANDBOX
      REAL_VALUE: "FALSE"
      REDEEMABLE: "FALSE"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  kani-postgres:
