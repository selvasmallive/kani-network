name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kani
          POSTGRES_USER: kani
          POSTGRES_PASSWORD: kani
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kani -d kani"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Rust toolchain
        run: rustup show

      - name: Check formatting
        run: cargo fmt --check

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run Postgres API integration test
        env:
          KANI_TEST_DATABASE_URL: postgres://kani:kani@localhost:5432/kani
        run: cargo test -p kani-api --test postgres_api -- --nocapture

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
