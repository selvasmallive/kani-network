phase: phase-3-enterprise
status: sandbox_enterprise_complete
inherits_from: phase2-lean-no-gke

runtime_boundary:
  env: SANDBOX
  real_value: false
  redeemable: false
  production_value_movement_allowed: false

workstreams:
  consensus:
    current: PoA
    target: BFT
    implementation_order:
      - consensus engine abstraction
      - shared proposal vote quorum certificate types
      - PoA adapter behind common interface
      - sandbox BFT prototype
      - multi-node validator operations later
    deferred:
      - production BFT claims
      - GKE validator operations

  institution_onboarding:
    entities:
      - Institution
      - InstitutionCredential
      - InstitutionAccount
      - InstitutionRole
      - OnboardingCase
    states:
      - requested
      - due_diligence
      - approved
      - rejected
      - suspended
      - offboarded
    credential_controls:
      - mtls_certificate_fingerprint
      - api_key_metadata
      - rotation_state
      - revocation_reason

  compliance:
    target_profile: enterprise-policy-versioned
    decisions:
      - allow
      - review
      - reject
      - hold
    case_states:
      - opened
      - assigned
      - evidence_requested
      - escalated
      - approved
      - rejected
      - closed
    adapters:
      sanctions_screening: vendor_boundary_only
      pep_screening: vendor_boundary_only
      adverse_media: vendor_boundary_only

  ingress:
    current: direct-cloud-run-with-iam
    target:
      - https_load_balancer_or_api_gateway
      - cloud_armor_waf
      - institution_mtls
      - private_api_to_database_path
      - admin_oidc
    forbidden:
      - allUsers
      - allAuthenticatedUsers
    design_checkpoint: phase3-prod-edge-design-rc1
    terraform_design_file: infra/terraform/phase3_prod_edge_design.tf

  key_management:
    target:
      - cloud_kms_hsm_inventory
      - purpose_scoped_keys
      - signing_service_boundary
      - dual_control_key_ceremony
      - rotation_and_revocation
      - crypto_profile_registry
    profiles_remain_config_driven: true
    design_checkpoint: phase3-key-management-design-rc1
    terraform_design_file: infra/terraform/phase3_key_management_design.tf

  regulatory_readiness:
    legal_advice: false
    requires_external_review: true
    gate_checkpoint: phase3-regulatory-readiness-gate-rc1
    gate_config: config/phase3-regulatory-readiness.yaml
    gate_script: scripts/phase3-regulatory-readiness-gate.ps1
    gate_status: blocked
    production_go_live_allowed: false
    real_value_capability_allowed: false
    gates:
      - legal_classification
      - registration_analysis
      - aml_kyc_program
      - sanctions_process
      - privacy_data_retention
      - institution_agreements
      - custody_safeguarding
      - incident_response
      - security_penetration_test
      - production_go_live_approval

  reporting:
    design_checkpoint: phase3-audit-reporting-hardening-rc1
    hardening_config: config/phase3-audit-reporting.yaml
    hardening_script: scripts/phase3-audit-reporting-hardening.ps1
    target:
      - immutable_audit_contract
      - reconciliation_by_asset_institution_block_and_day
      - export_boundaries
      - retention_matrix
    production_reporting_enabled: false
    external_report_delivery_enabled: false
    real_value_reporting_ready: false

  operational_readiness:
    runbook_checkpoint: phase3-operational-runbooks-rc1
    runbook_config: config/phase3-operational-runbooks.yaml
    runbook_script: scripts/phase3-operational-runbooks.ps1
    production_operations_enabled: false
    changes_google_cloud_resources: false
    gke_validator_operations_enabled: false
    required_runbooks:
      - daily_operations
      - validator_operations
      - incident_response
      - release_rollback
      - backup_restore
      - credential_rotation
      - audit_evidence_pack

  wrap_up:
    wrapup_checkpoint: phase3-wrapup-rc1
    wrapup_config: config/phase3-wrapup.yaml
    wrapup_script: scripts/phase3-wrapup.ps1
    completion_scope: sandbox_enterprise_track
    completion_percentage: 100
    production_ready: false
    real_value_ready: false
    next_phase: phase-4-pre-production-readiness

acceptance:
  phase3_plan_checked_in: true
  static_validator_required: true
  phase2_lean_unchanged: true
  creates_paid_resources: false
  creates_real_value_capability: false
  sandbox_enterprise_track_complete: true
  production_ready: false
  real_value_ready: false

implementation_slices:
  phase3_spec_rc1:
    status: complete
    creates_paid_resources: false
    creates_real_value_capability: false
  phase3_institution_model_rc1:
    status: implementation_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    migration: migrations/0002_phase3_institutions.sql
    admin_api:
      - GET /v1/admin/institutions
      - POST /v1/admin/institutions
      - GET /v1/admin/institutions/{id}
      - POST /v1/admin/institutions/{id}/credentials
      - POST /v1/admin/institutions/{id}/suspend
      - POST /v1/admin/institutions/{id}/limits
    enforcement:
      - suspended_institutions_cannot_operate_accounts
      - credential_and_limit_changes_are_audit_logged
  phase3_compliance_cases_rc1:
    status: implementation_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    migration: migrations/0009_phase3_compliance_cases.sql
    payment_statuses:
      - HELD
      - PENDING
      - FINALIZED
      - REJECTED
    admin_api:
      - GET /v1/compliance/cases
      - GET /v1/compliance/cases/{id}
      - POST /v1/compliance/cases/{id}/approve
      - POST /v1/compliance/cases/{id}/reject
    enforcement:
      - review_decisions_open_compliance_cases
      - held_payments_are_not_validator_pending
      - approved_cases_release_payment_to_pending
      - rejected_cases_mark_payment_rejected
  phase3_consensus_interface_rc1:
    status: implementation_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    default_engine: phase1-poa
    implemented:
      - ConsensusEngine trait
      - ConsensusEngineConfig
      - ConfiguredConsensusEngine
      - PoA adapter
      - shared proposal vote quorum certificate finality proof types
    deferred:
      - BFT implementation
      - validator network transport
      - GKE validator operations
      - production finality claims
  phase3_bft_prototype_rc1:
    status: implementation_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    default_engine: phase1-poa
    sandbox_engine: sandbox-bft-prototype
    implemented:
      - BftConsensus sandbox prototype
      - ConsensusEngineConfig::sandbox_bft_prototype
      - proposal prevote precommit quorum certificate finality proof simulation
      - strict greater-than-two-thirds quorum tests
      - invalid quorum duplicate vote and wrong validator set rejection tests
    runtime_boundary:
      node_default: phase1-poa
      validator_runtime_default: phase1-poa
      bft_enabled_by_default: false
    deferred:
      - validator peer networking
      - timeout and round change protocol
      - equivocation evidence persistence
      - HSM or KMS signing
      - GKE validator operations
      - production finality claims
  phase3_prod_edge_design_rc1:
    status: design_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    terraform_design_file: infra/terraform/phase3_prod_edge_design.tf
    guard_variable: phase3_prod_edge_design_enabled
    guard_default: false
    declares_google_cloud_resources: false
    target_components:
      - global_external_https_load_balancer_or_api_gateway
      - certificate_manager_tls_certificate
      - certificate_manager_trust_config
      - institution_mtls
      - cloud_armor_waf
      - cloud_armor_rate_limiting
      - serverless_neg_to_kani_api
      - private_cloud_run_ingress
      - admin_oidc
      - private_api_to_database_path
    forbidden:
      - allUsers
      - allAuthenticatedUsers
    deferred:
      - load_balancer_apply
      - cloud_armor_policy_apply
      - certificate_manager_apply
      - mtls_trust_config_apply
      - cloud_run_ingress_change
      - production_dns_changes
      - real_value_enablement
  phase3_key_management_design_rc1:
    status: design_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    terraform_design_file: infra/terraform/phase3_key_management_design.tf
    guard_variable: phase3_key_management_design_enabled
    guard_default: false
    declares_google_cloud_resources: false
    crypto_profile: hybrid-pqc-v1
    key_purposes:
      - validator_block_signing
      - treasury_asset_authority
      - api_request_signing
      - audit_log_signing
      - iso20022_message_signing
    key_states:
      - pending
      - active
      - retiring
      - retired
      - compromised
      - revoked
    signing_boundary:
      - canonical_signing_request
      - purpose_authorization
      - key_version_returned
      - audit_event_for_every_attempt
    ceremony_gates:
      - two_operator_key_creation_approval
      - separate_key_activation_approval
      - emergency_revocation_break_glass_path
      - post_ceremony_evidence_attached
    deferred:
      - kms_key_ring_apply
      - kms_crypto_key_apply
      - cloud_hsm_key_generation
      - production_signing_service
      - validator_hsm_signing
      - treasury_hsm_signing
      - real_value_enablement
  phase3_regulatory_readiness_gate_rc1:
    status: gate_ready
    gate_status: blocked
    creates_paid_resources: false
    creates_real_value_capability: false
    legal_advice: false
    requires_external_review: true
    gate_config: config/phase3-regulatory-readiness.yaml
    gate_script: scripts/phase3-regulatory-readiness-gate.ps1
    production_go_live_allowed: false
    real_value_capability_allowed: false
    external_customer_access_allowed: false
    fiat_deposit_or_redemption_allowed: false
    custody_for_others_allowed: false
    trading_allowed: false
    required_gates:
      - legal_classification
      - registration_analysis
      - aml_kyc_program
      - sanctions_process
      - privacy_data_retention
      - institution_agreements
      - custody_safeguarding
      - incident_response
      - security_penetration_test
      - production_go_live_approval
    required_evidence:
      - named_owner
      - qualified_reviewer
      - evidence_link
      - approval_date
      - signed_approval_record
    deferred:
      - legal_determinations
      - registration_or_licensing_action
      - customer_onboarding
      - real_money_transfer
      - fiat_deposit_or_redemption
      - custody_for_others
      - production_go_live_approval
  phase3_audit_reporting_hardening_rc1:
    status: hardening_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    hardening_config: config/phase3-audit-reporting.yaml
    hardening_script: scripts/phase3-audit-reporting-hardening.ps1
    production_reporting_enabled: false
    external_report_delivery_enabled: false
    real_value_reporting_ready: false
    reporting_surfaces:
      - settlement_summary
      - compliance_decisions
      - validator_finality
      - reconciliation
      - audit_event_export
    immutable_audit_contract:
      - event_id
      - event_type
      - created_at
      - actor_institution_id
      - resource_type
      - resource_id
      - decision
      - block_height
      - transaction_id
      - metadata_hash
      - previous_event_hash
      - event_hash
    reconciliation_sources:
      - finalized_blocks
      - finalized_transactions
      - journal_entries
      - account_balances
      - issued_supply
      - compliance_decisions
      - validator_finality_records
    export_controls:
      - admin_authorization_required
      - requester_identity_required
      - export_purpose_required
      - deterministic_filters_required
      - time_window_required
      - secrets_redacted
      - privacy_legal_review_required
    deferred:
      - production_hash_chain_enforcement
      - signed_audit_envelope
      - external_report_delivery
      - siem_export
      - data_warehouse_replication
      - legal_approved_retention_periods
      - real_value_reporting
  phase3_operational_runbooks_rc1:
    status: operational_runbooks_ready
    creates_paid_resources: false
    creates_real_value_capability: false
    changes_google_cloud_resources: false
    production_operations_enabled: false
    runbook_config: config/phase3-operational-runbooks.yaml
    runbook_script: scripts/phase3-operational-runbooks.ps1
    operator_roles:
      - technical_operator
      - settlement_operator
      - compliance_reviewer
      - security_operator
      - audit_reviewer
      - release_approver
    runbooks:
      - daily_operations
      - validator_operations
      - incident_response
      - release_rollback
      - backup_restore
      - credential_rotation
      - audit_evidence_pack
    validator_topology:
      current: cloud_run_job_scheduler_no_gke
      required_finality_votes: 2
      gke_deferred: true
    release_preflight:
      - cargo_fmt_check
      - cargo_clippy_workspace_deny_warnings
      - cargo_test_workspace
      - phase2_validate
      - phase3_validate
    deferred:
      - gke_multi_node_validator_runbooks
      - hsm_backed_production_signing_ceremonies
      - production_mtls_certificate_issuance
      - external_institution_onboarding_operations
      - real_value_incident_response
      - production_rto_rpo_commitments
  phase3_wrapup_rc1:
    status: sandbox_enterprise_track_complete
    creates_paid_resources: false
    creates_real_value_capability: false
    changes_google_cloud_resources: false
    completion_scope: sandbox_enterprise_track
    completion_percentage: 100
    wrapup_config: config/phase3-wrapup.yaml
    wrapup_script: scripts/phase3-wrapup.ps1
    completed_release_candidates:
      - phase3-spec-rc1
      - phase3-institution-model-rc1
      - phase3-compliance-cases-rc1
      - phase3-consensus-interface-rc1
      - phase3-bft-prototype-rc1
      - phase3-prod-edge-design-rc1
      - phase3-key-management-design-rc1
      - phase3-regulatory-readiness-gate-rc1
      - phase3-audit-reporting-hardening-rc1
      - phase3-operational-runbooks-rc1
      - phase3-wrapup-rc1
    non_enablement:
      gke_cluster_enabled: false
      production_bft_enabled: false
      hsm_signing_enabled: false
      production_ingress_enabled: false
      external_customer_access_enabled: false
      real_value_reporting_enabled: false
      legal_or_regulatory_approval_claimed: false
    next_phase:
      id: phase-4-pre-production-readiness
      real_value_enablement_allowed: false
      required_first_steps:
        - assign_readiness_gate_owners
        - collect_legal_and_compliance_review_evidence
        - review_production_cost_estimate
        - plan_paid_resource_terraform_before_apply
