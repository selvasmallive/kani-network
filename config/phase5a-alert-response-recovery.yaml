release_candidate: phase5a-alert-response-recovery-rc1
status: alert_response_recovery_checkpoint_ready
inherits_from: phase5a-operator-evidence-packs-rc1
track: phase5a-no-gke-validator-hardening
active_runtime_baseline: phase2-lean-no-gke
gke_phase: phase5b-gke-validator-ops

runtime_boundary:
  env: SANDBOX
  real_value: false
  redeemable: false
  production_value_movement_allowed: false

resource_boundary:
  creates_paid_resources: false
  changes_google_cloud_resources: false
  terraform_apply_allowed: false
  google_cloud_resource_creation_allowed: false
  paid_resource_enablement_allowed: false
  scheduler_changes_enabled: false
  automatic_scheduler_mutation_enabled: false
  manual_scheduler_action_approved_by_this_checkpoint: false
  cloud_run_job_execution_approved_by_this_checkpoint: false
  secret_rotation_approved_by_this_checkpoint: false
  failure_injection_enabled: false
  live_failure_drills_enabled: false
  live_retry_drills_enabled: false
  live_recovery_drills_enabled: false
  production_replay_enabled: false
  external_evidence_export_enabled: false
  production_approval_via_evidence_pack_enabled: false

validator_model:
  runtime: cloud_run_job_plus_cloud_scheduler
  run_mode: sweep
  scheduler_cadence: "*/15 * * * *"
  consensus: phase1-poa
  finality_model: two_of_three
  required_finality_votes: 2
  validator_count: 3
  validators:
    - validator-a
    - validator-b
    - validator-c

alert_classes:
  api_error_logs:
    source: cloud_run_api_logs
    recovery_allowed_by_this_checkpoint: false
  validator_job_error_logs:
    source: cloud_run_validator_job_logs
    recovery_allowed_by_this_checkpoint: false
  scheduler_error_logs:
    source: cloud_scheduler_logs
    recovery_allowed_by_this_checkpoint: false
  cloud_sql_error_logs:
    source: cloud_sql_logs
    recovery_allowed_by_this_checkpoint: false
  budget_brake_activity_logs:
    source: cost_guard_logs
    recovery_allowed_by_this_checkpoint: false
  validator_finality_gap:
    source: validator_finality_report
    recovery_allowed_by_this_checkpoint: false
  pending_transaction_backlog:
    source: pending_transaction_api
    recovery_allowed_by_this_checkpoint: false
  ledger_reconciliation_discrepancy:
    source: reconciliation_evidence_pack
    recovery_allowed_by_this_checkpoint: false

required_response_stages:
  detect:
    required: true
  classify:
    required: true
  contain:
    required: true
  collect_evidence:
    required: true
  recover:
    required: true
  reconcile:
    required: true
  review:
    required: true
  archive:
    required: true

evidence_sources:
  cloud_monitoring_incident: Cloud Monitoring alert incident
  cloud_logging_query_export_summary: Cloud Logging query/export summary
  cloud_run_service_execution_state: Cloud Run service execution state
  cloud_run_validator_job_execution_state: Cloud Run validator job execution state
  cloud_scheduler_job_state: Cloud Scheduler job state
  cloud_sql_health_error_evidence: Cloud SQL health and error evidence
  budget_cost_guard_event: Budget and cost-guard event evidence
  health_endpoint: GET /health
  pending_transactions: GET /v1/transactions/pending?limit=500&offset=0
  latest_block: GET /v1/blocks/latest
  validator_finality: GET /v1/reports/validator-finality?limit=500&offset=0
  settlement_summary: GET /v1/reports/settlement-summary?limit=500&offset=0
  compliance_decisions: GET /v1/reports/compliance-decisions?limit=500&offset=0
  audit_events: GET /v1/audit-events?limit=500&offset=0
  prior_operator_evidence_pack: phase5a-operator-evidence-packs-rc1

recovery_action_catalog:
  acknowledge_incident:
    documented_only: true
    execution_approved_by_this_checkpoint: false
  collect_baseline_evidence:
    documented_only: true
    execution_approved_by_this_checkpoint: false
  manually_execute_validator_job_if_approved:
    documented_only: true
    execution_approved_by_this_checkpoint: false
  resume_scheduler_if_approved:
    documented_only: true
    execution_approved_by_this_checkpoint: false
  rotate_sandbox_api_key_if_key_incident_and_approved:
    documented_only: true
    execution_approved_by_this_checkpoint: false
  run_reconciliation_evidence:
    documented_only: true
    execution_approved_by_this_checkpoint: false
  document_residual_risk:
    documented_only: true
    execution_approved_by_this_checkpoint: false

required_gates_before_live_recovery_drill_or_action:
  sandbox_only_purpose_recorded: blocked
  incident_owner_assigned: blocked
  recovery_owner_assigned: blocked
  approver_identified: blocked
  change_window_approved: blocked
  expected_alert_signal_documented: blocked
  expected_recovery_signal_documented: blocked
  operator_evidence_pack_location_selected: blocked
  rollback_path_documented: blocked
  cost_impact_reviewed: blocked
  no_real_value_capability_enabled: blocked

evidence_pack_schema:
  required_fields:
    - pack_id
    - pack_type
    - incident_id
    - alert_class
    - release_candidate
    - environment
    - real_value
    - redeemable
    - operator
    - reviewer
    - incident_owner
    - recovery_owner
    - approver
    - started_at
    - completed_at
    - project_id
    - region
    - base_url
    - alert_source
    - response_stage_results
    - baseline_evidence
    - recovery_action_requested
    - recovery_action_approval
    - reconciliation_result
    - residual_risk
    - follow_up_actions
    - redaction_attestation
  forbidden_fields:
    - api_keys
    - bearer_tokens
    - secret_manager_values
    - raw_private_keys
    - signing_material
    - customer_data
    - real_value_records
    - database_passwords

non_enablement:
  live_recovery_drills_enabled: false
  manual_scheduler_action_approved_by_this_checkpoint: false
  cloud_run_job_execution_approved_by_this_checkpoint: false
  secret_rotation_approved_by_this_checkpoint: false
  failure_injection_enabled: false
  live_failure_drills_enabled: false
  live_retry_drills_enabled: false
  production_replay_enabled: false
  external_evidence_export_enabled: false
  production_approval_via_evidence_pack_enabled: false
  gke_cluster_enabled: false
  gke_required: false
  production_bft_validator_network_enabled: false
  production_ingress_enabled: false
  public_endpoint_exposure_enabled: false
  cloud_armor_waf_applied: false
  mtls_trust_config_applied: false
  hsm_kms_production_signing_enabled: false
  scheduler_changes_enabled: false
  automatic_scheduler_mutation_enabled: false
  restore_drill_executed: false
  production_recovery_executed: false
  external_institution_onboarding_enabled: false
  production_authorization_granted: false
  legal_or_compliance_approval_enabled: false
  real_value_settlement_enabled: false
  fiat_deposit_or_redemption_enabled: false
  custody_for_others_enabled: false
  trading_enabled: false
  terraform_apply_allowed: false
  google_cloud_resource_creation_allowed: false
  production_go_live_allowed: false

acceptance:
  phase5a_alert_response_recovery_checked_in: true
  structured_phase5a_alert_response_recovery_config_exists: true
  static_phase5a_alert_response_recovery_validator_required: true
  aggregate_phase5a_validator_includes_alert_response_recovery: true
  phase5a_operator_evidence_pack_validator_required: true
  phase5a_ledger_replay_validator_required: true
  phase5a_failure_retry_validator_required: true
  phase5a_scheduler_runbooks_validator_required: true
  phase5a_reconciliation_validator_required: true
  phase5a_hardening_plan_validator_required: true
  phase4_validator_required: true
  phase3_validator_required: true
  phase2_validator_required: true
  terraform_validate_required: true
  rust_workspace_checks_required: true
  no_google_cloud_resources_created: true
  no_scheduler_changes_enabled: true
  no_manual_scheduler_action_approved: true
  no_cloud_run_job_execution_approved: true
  no_secret_rotation_approved: true
  no_failure_injection_enabled: true
  no_live_failure_drills_enabled: true
  no_live_retry_drills_enabled: true
  no_live_recovery_drills_enabled: true
  no_production_replay_enabled: true
  no_external_evidence_export_enabled: true
  no_production_approval_via_evidence_pack_enabled: true
  no_gke_enabled: true
