release_candidate: phase3-operational-runbooks-rc1
status: operational_runbooks_ready

runtime_boundary:
  env: SANDBOX
  real_value: false
  redeemable: false
  production_operations_enabled: false
  production_value_movement_allowed: false

resource_boundary:
  creates_paid_resources: false
  creates_real_value_capability: false
  changes_google_cloud_resources: false
  enables_gke_validator_operations: false

operator_roles:
  - technical_operator
  - settlement_operator
  - compliance_reviewer
  - security_operator
  - audit_reviewer
  - release_approver

runbooks:
  daily_operations:
    required: true
    evidence:
      - active_project_id
      - api_health_result
      - latest_block_height
      - finality_voters
      - pending_payment_count
      - held_payment_count
      - compliance_case_summary
      - cloud_sql_backup_pitr_status
      - open_incidents
  validator_operations:
    current_topology: cloud_run_job_scheduler_no_gke
    logical_validators:
      - validator-a
      - validator-b
      - validator-c
    required_finality_votes: 2
    gke_deferred: true
    pause_conditions:
      - unexpected_production_flag_value
      - cloud_sql_connectivity_errors
      - repeated_validator_job_failures
      - ledger_reconciliation_discrepancy
      - budget_guardrail_trigger
      - suspected_credential_compromise
  incident_response:
    severity_levels:
      - SEV1
      - SEV2
      - SEV3
    sev1_required_actions:
      - freeze_validator_scheduler
      - disable_external_ingress_if_active
      - rotate_affected_sandbox_credentials
      - preserve_logs_audit_events_image_digests_and_timeline
      - notify_security_compliance_and_release_approvers
      - require_written_recovery_approval
  release_rollback:
    preflight_checks:
      - cargo_fmt_check
      - cargo_clippy_workspace_deny_warnings
      - cargo_test_workspace
      - phase2_validate
      - phase3_validate
      - terraform_fmt_validate_plan_when_in_scope
    release_evidence:
      - git_commit_and_tag
      - container_image_digest
      - terraform_plan_or_no_infra_change_statement
      - api_smoke_test_result
      - security_smoke_test_result
      - operator_approval
    rollback_options:
      - previous_cloud_run_revision
      - previous_validator_job_image_digest
      - disable_cloud_scheduler
      - last_known_good_terraform_plan_review
      - cloud_sql_pitr_restore_to_separate_instance
  backup_restore:
    required_controls:
      - automated_backups_enabled
      - pitr_enabled
      - restore_to_separate_target
      - reconciliation_before_promotion
      - evidence_attached
    reconciliation_sources:
      - finalized_blocks
      - finalized_transactions
      - journal_entries
      - account_balances
      - issued_supply
      - compliance_decisions
      - audit_events
  credential_rotation:
    triggers:
      - scheduled_rotation
      - operator_departure_or_role_change
      - suspected_exposure
      - failed_access_review
      - new_credential_profile
    required_steps:
      - create_replacement_secret_or_credential_metadata
      - deploy_dependent_service_with_new_version
      - run_api_validator_security_and_smoke_checks
      - revoke_or_retire_old_credential
      - confirm_no_secrets_in_logs_or_audit_exports
      - record_rotation_evidence_and_approver
  audit_evidence_pack:
    required_fields:
      - git_commit_and_tag
      - operator_identity
      - approval_record
      - runtime_boundary_proof
      - command_summary
      - cloud_resource_identifiers_touched
      - ledger_block_height_before_after
      - compliance_case_impact
      - audit_export_reference
      - deferrals_and_follow_up_owner

deferred:
  - gke_multi_node_validator_runbooks
  - hsm_backed_production_signing_ceremonies
  - production_mtls_certificate_issuance
  - external_institution_onboarding_operations
  - real_value_incident_response
  - legal_approved_data_retention_periods
  - production_rto_rpo_commitments

acceptance:
  operational_runbooks_checked_in: true
  static_validator_required: true
  phase3_validator_includes_checkpoint: true
  no_google_cloud_resources_created: true
  no_production_operations_enabled: true
  no_real_value_operations_enabled: true
