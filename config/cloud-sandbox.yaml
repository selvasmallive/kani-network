environment:
  env: SANDBOX
  real_value: false
  redeemable: false
  cost_profile: lean-free-trial

gcp:
  project_id: kani-network-sandbox
  region: northamerica-northeast1
  gke_location: northamerica-northeast1-a

artifact_registry:
  repository: kani
  image: kani-api

cloud_run:
  service: kani-sandbox-api
  ingress: internal-and-cloud-load-balancing
  port: 8080
  ledger_mode: postgres
  database_url_secret: kani-sandbox-database-url
  min_instances: 0
  max_instances: 1

gke:
  cluster: kani-sandbox-validators
  namespace: kani-system
  node_count: 1
  machine_type: e2-small
  node_disk_size_gb: 20
  validators:
    - validator-a
    - validator-b
    - validator-c

cloud_sql:
  instance: kani-sandbox-ledger
  database: kani
  user: kani
  database_url_secret: kani-sandbox-database-url
  tier: db-f1-micro
  disk_size_gb: 10
  disk_type: PD_HDD
  backups_enabled: false
  point_in_time_recovery_enabled: false

storage:
  block_archive_bucket: kani-sandbox-block-archive

kms:
  key_ring: kani-sandbox
  signing_key: validator-signing-sandbox

phase_gate:
  sandbox_only: true
  production_value_movement_allowed: false
  requires_legal_review_before_real_value: true
