phase5a_baseline: phase5a-wrapup-rc1
terraform_design_baseline: phase5b-gke-terraform-design-plan-rc1
manifest_design_file: k8s/phase5b-validator-manifest-design.yaml

runtime_boundary:
  env: SANDBOX
  real_value: false
  redeemable: false
  production_value_movement_allowed: false

manifest_boundary:
  design_only: true
  kubernetes_manifest_deployment_enabled: false
  kubectl_apply_allowed: false
  kustomization_inclusion_allowed: false
  included_in_kustomization: false
  contains_deployable_kubernetes_objects: false
  declares_top_level_api_version_or_kind: false
  produces_planning_metadata_only: true
  gke_validator_workloads_deferred: true
  workload_identity_iam_mutation_deferred: true
  live_validator_operations_enabled: false

current_phase2_manifest_inventory:
  namespace_yaml: present_placeholder
  validator_rbac_yaml: present_placeholder
  validator_configmap_yaml: present_placeholder
  validator_secret_example_yaml: present_placeholder
  validators_yaml: present_placeholder
  kustomization_yaml: present_placeholder
  phase5b_design_file_included_in_kustomization: false
  phase5b_manifest_deployment_approved: false

selected_manifest_defaults:
  selected_resource_profile: lean_sandbox_standard_zonal
  cluster_mode: standard_zonal
  region: northamerica-northeast1
  zones:
    - northamerica-northeast1-a
  validator_namespace: kani-validator
  kubernetes_service_account: kani-gke-validator
  google_service_account: kani-gke-validator@PROJECT_ID.iam.gserviceaccount.com
  workload_identity_annotation: iam.gke.io/gcp-service-account
  image_repository: northamerica-northeast1-docker.pkg.dev/PROJECT_ID/kani/kani-api
  image_tag_policy: pinned_digest_required_before_apply
  validator_replicas: 3
  validator_instances:
    - validator-a
    - validator-b
    - validator-c
  workload_shape: three_single_replica_deployments_initial_design
  database_connectivity_model: cloud_sql_proxy_sidecar_or_connector_design_pending
  secret_delivery_model: secret_manager_csi_or_external_secret_design_pending
  public_ingress_required: false
  service_type: ClusterIP_or_none_for_internal_validator_only
  smoke_test_mode: dry_run_only_until_apply_approved
  teardown_model: remove_manifest_release_or_delete_namespace_after_approved_test_window

