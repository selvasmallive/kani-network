[workspace]
resolver = "2"
members = [
  "crates/kani-api",
  "crates/kani-compliance",
  "crates/kani-consensus",
  "crates/kani-crypto",
  "crates/kani-iso20022",
  "crates/kani-ledger",
  "crates/kani-node",
  "crates/kani-types",
]

[workspace.package]
edition = "2021"
license = "Proprietary"
rust-version = "1.76"

[workspace.dependencies]
anyhow = "1"
axum = "0.7"
chrono = { version = "0.4", features = ["clock", "serde"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
sha3 = "0.10"
sqlx = { version = "0.8", features = ["chrono", "json", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["serde", "v4"] }
